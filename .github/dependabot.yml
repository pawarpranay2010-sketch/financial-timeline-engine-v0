# Dependabot — dependency + GitHub Actions version updates
# https://docs.github.com/en/code-security/dependabot
version: 2

updates:
  # Python dependencies (pip ecosystem reads requirements*.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
